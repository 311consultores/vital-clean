; #9: fotos de evidencia tomadas con la cámara del celular pueden pesar
; 8-15MB en equipos modernos. La vista ya las comprime en el navegador
; antes de subirlas, pero se sube también el límite de PHP por si el
; hosting compartido lo tenía más bajo (causa real del error reportado:
; PHP descarta el archivo silenciosamente antes de que Laravel lo valide).
; Solo funciona en hosting con PHP como CGI/FastCGI (cPanel típicamente sí);
; si no aplica, pide a soporte de Banahosting subir estos valores en la
; sección "MultiPHP INI Editor" de cPanel.
upload_max_filesize = 20M
post_max_size = 25M
